<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課程資訊 | 元智大學資訊工程學系</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { yzu: { blue: '#0055A5', cyan: '#00D2FF', dark: '#0B132B', card: '#1C2541', accent: '#48CAE4' } } } } }
  </script>
  <style>body { font-family: 'Noto Sans TC', sans-serif; background-color: #070B19; color: #E2E8F0; }</style>
</head>
<body class="relative overflow-x-hidden">
  <!-- 導覽列 -->
  <nav class="sticky top-0 z-50 bg-yzu-dark/95 backdrop-blur-lg border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <img src="origin-logo.png" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Yuan_Ze_University_logo.svg/512px-Yuan_Ze_University_logo.svg.png'" class="w-10 h-10 object-contain">
        <div class="text-lg font-bold text-white">元智大學 <span class="text-yzu-cyan">資訊工程學系</span></div>
      </a>
      <a href="index.html" class="text-xs font-mono text-yzu-cyan hover:underline"><i class="fa-solid fa-house mr-1"></i> 返回首頁</a>
    </div>
  </nav>

  <!-- 主要內容區 -->
  <div class="max-w-5xl mx-auto px-4 py-12 space-y-12">
    <!-- 麵包屑導航 -->
    <div class="text-sm font-mono text-slate-400 mb-4"><a href="index.html" class="hover:text-yzu-cyan">首頁</a> / <span class="text-yzu-cyan">課程</span></div>
    
    <!-- 課程總覽容器 -->
    <div class="bg-yzu-card border border-slate-800 rounded-3xl p-8 sm:p-12 shadow-2xl space-y-8">
      <h1 class="text-3xl font-extrabold text-white border-b border-slate-800 pb-4 flex items-center gap-3">
        <i class="fa-solid fa-book-open text-yzu-cyan"></i> 課程資訊與學程規劃
      </h1>
      <p class="text-slate-300 text-sm leading-relaxed">
        元智資工系提供紮實且與產業脈動緊密結合的課程架構。大學部（Undergraduate Courses）涵蓋程式設計、演習、系統架構與五大專業領域核心選修，為學生奠定深厚的資通讯實力。
      </p>

      <!-- 課程分類區塊 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-slate-900/60 p-6 rounded-2xl border border-slate-800">
          <div class="text-yzu-cyan font-bold text-base mb-2"><i class="fa-solid fa-code mr-2"></i>大一至大二基礎必修</div>
          <p class="text-xs text-slate-400 leading-relaxed mb-3">包含程式設計、物件導向程式設計、資料結構、演算法、計算機組織與離散數學。</p>
          <span class="text-[10px] bg-yzu-blue/30 text-yzu-cyan px-2.5 py-1 rounded font-mono">建立扎實理論基礎</span>
        </div>
        <div class="bg-slate-900/60 p-6 rounded-2xl border border-slate-800">
          <div class="text-yzu-cyan font-bold text-base mb-2"><i class="fa-solid fa-graduation-cap mr-2"></i>大三至大四進階實務</div>
          <p class="text-xs text-slate-400 leading-relaxed mb-3">包含專題製作、一年期企業專業實習、作業系統、資料庫系統與人工智慧概論。</p>
          <span class="text-[10px] bg-yzu-blue/30 text-yzu-cyan px-2.5 py-1 rounded font-mono">無縫接軌產學界</span>
        </div>
      </div>

      <!-- 五大領域核心課程標籤 -->
      <div class="space-y-4 pt-4">
        <h3 class="text-white font-bold text-base">五大前瞻學習領域核心選修</h3>
        <div class="flex flex-wrap gap-2">
          <span class="bg-slate-900 text-yzu-accent border border-yzu-accent/30 px-3 py-1.5 rounded-lg text-xs font-mono">人工智慧與數據科學</span>
          <span class="bg-slate-900 text-yzu-accent border border-yzu-accent/30 px-3 py-1.5 rounded-lg text-xs font-mono">軟體系統</span>
          <span class="bg-slate-900 text-yzu-accent border border-yzu-accent/30 px-3 py-1.5 rounded-lg text-xs font-mono">晶片設計</span>
          <span class="bg-slate-900 text-yzu-accent border border-yzu-accent/30 px-3 py-1.5 rounded-lg text-xs font-mono">網路、雲端與物聯網</span>
          <span class="bg-slate-900 text-yzu-accent border border-yzu-accent/30 px-3 py-1.5 rounded-lg text-xs font-mono">多媒體與人機互動</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
